# Cocogitto configuration for conventional commit-based versioning and release notes.
#
# Usage (the pinned cog uses this configuration; with a locally installed `cog`, pass `--config .cog.toml`):
#   bazel run //:cog -- check                  # Validate commit messages
#   bazel run //:cog -- bump --auto --dry-run  # Preview next version
#   bazel run //:cog -- bump --auto            # Create the `chore(version): vX.Y.Z` release commit
#
# Release notes are not kept in the repository. CI creates them on the GitHub release, see
# tools/release/release_notes.py and the "Releases & Versioning" section of CONTRIBUTING.md.
#
# See https://docs.cocogitto.io/reference/config.html

tag_prefix = "v"

# "HEAD" allows usage from jj's detached HEAD mode
branch_whitelist = ["main", "release/*", "HEAD"]

# Update the Python wheel version / embed_label in the bazel.rc file before the bump commit
# (replaces the whole label, including pre-release parts like `-rc.1`)
pre_bump_hooks = [
    """sed -i 's/embed_label=[^[:space:]]*/embed_label={{version}}/g' .bazelrc""",
]

# Remove the local tag created by cog bump (CI creates the tag when the release commit lands), and
# draft the release notes in the body of the release commit (with the cog running the hooks: `bazel run //:cog`
# exports it as COG, otherwise `cog` on the PATH)
post_bump_hooks = [
    "git tag --delete {{version_tag}}",
    "python3 tools/release/release_notes.py draft {{version}}",
]

# The bump commit only changes .bazelrc; release notes live on GitHub releases
disable_changelog = true

# Used by `cog changelog` to render the change list of the release notes
[changelog]
template = "remote"
remote = "github.com"
owner = "NVIDIA"
repository = "ncore"

# GitHub usernames of commit authors, mentioned in the change list of the release notes (matched by
# git author name, authors without an entry are listed by name)
[[changelog.authors]]
signature = "Alex Perec"
username = "aperec-nvidia"

[[changelog.authors]]
signature = "Emmanuel Attia"
username = "eattia-nvidia"

[[changelog.authors]]
signature = "Janick Martinez Esturo"
username = "janickm"

[[changelog.authors]]
signature = "Michael Shelley"
username = "michael-shelley"

[[changelog.authors]]
signature = "Minh Vu"
username = "fallintoplace"

[[changelog.authors]]
signature = "Sanchit Garg"
username = "sanchitgarg"

[[changelog.authors]]
signature = "Wei Zhang"
username = "Willyzw"

[[changelog.authors]]
signature = "Zan Gojcic"
username = "zgojcic"

# Commit types and their titles in the release notes.
# Types not listed here use cocogitto defaults.
[commit_types]
feat = { changelog_title = "➕ Added", order = 1 }
fix = { changelog_title = "🪲 Fixed", order = 2 }
perf = { changelog_title = "⚡ Performance", order = 3 }
refactor = { changelog_title = "🔄 Changed", order = 4 }
docs = { changelog_title = "📚 Documentation", order = 5 }
ci = { changelog_title = "⚙️ CI", order = 6 }
build = { changelog_title = "🏗️ Build", order = 7 }
style = { changelog_title = "🎨 Style", order = 8 }
chore = { changelog_title = "🔧 Chore", order = 9 }
test = { changelog_title = "🧪 Tests", order = 10 }
