name: 'Save Bazel disk cache'
description: 'Saves the Bazel disk cache restored by setup-bazel, reduced to the entries used by this job'

runs:
  using: 'composite'
  steps:
    # Bazel updates the modification time of disk cache entries it reads or writes, so entries older
    # than the restore are unused by this job. Dropping them keeps the cache at the size of a single
    # build instead of growing with every change.
    - name: Drop unused Bazel disk cache entries
      shell: bash
      run: |
        du -sh ~/.cache/bazel-disk
        find ~/.cache/bazel-disk -type f ! -newer ~/.cache/bazel-disk.restored -delete
        du -sh ~/.cache/bazel-disk

    - name: Save Bazel disk cache
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/bazel-disk
        key: bazel-disk-${{ github.job }}-${{ github.ref_name }}-${{ github.sha }}
